version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: skincare-db
    environment:
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: skincare
      POSTGRES_DB: skincare
    ports:
      - "5432:5432"
    volumes:
      - skincare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincare -d skincare"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skincare-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://skincare:skincare@db:5432/skincare
      AI_BACKEND: demo
    ports:
      - "12000:12000"
    volumes:
      - ./backend:/app/backend
      - uploads:/app/backend/uploads
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skincare-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  skincare_pgdata:
  uploads:

